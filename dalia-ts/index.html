<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Primary -->
    <title>Dalia — Real-Time Audio Visualizer | Rust/WASM + Three.js</title>
    <meta name="description" content="Dalia turns music into immersive 3D visuals in real time. FFT analysis, BPM detection, and 20 procedural geometries — powered by Rust/WebAssembly and Three.js. Open source." />
    <meta name="keywords" content="audio visualizer, music visualizer, WebAssembly, Rust, WASM, Three.js, FFT, real-time, open source, procedural geometry, BPM detection" />
    <meta name="author" content="TheAdkk" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dalia-phi.vercel.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dalia-phi.vercel.app" />
    <meta property="og:title" content="Dalia — Real-Time Audio Visualizer | Rust/WASM + Three.js" />
    <meta property="og:description" content="Turns music into immersive 3D visuals in real time. FFT, BPM detection, 20 procedural geometries. Powered by Rust/WebAssembly and Three.js." />
    <meta property="og:site_name" content="Dalia" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dalia — Real-Time Audio Visualizer | Rust/WASM + Three.js" />
    <meta name="twitter:description" content="Turns music into immersive 3D visuals in real time. FFT, BPM detection, 20 procedural geometries. Powered by Rust/WebAssembly and Three.js." />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0a" />
  </head>
  <body>
    <div id="app">
      <audio id="audio-player" crossorigin="anonymous" style="display: none;"></audio>

      <!-- Fullscreen visualizer -->
      <canvas id="visualizer"></canvas>

      <!-- Glassmorphism Floating Player -->
      <div id="floating-player" class="player-container fade-out">
        <button id="play-pause-btn" class="control-btn play" title="Play"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256"><path fill="currentColor" d="M232.31,114.34l-152-96A15.89,15.89,0,0,0,56.1,32.25C56,32.31,56,32.37,56,32.43V223.57c0,.06,0,.12,0,.18a16,16,0,0,0,24.21,13.88l152-96A16,16,0,0,0,232.31,114.34Z"/></svg></button>
        <div class="progress-wrapper">
          <span id="time-current">0:00</span>
          <input type="range" id="progress-bar" value="0" max="100" step="0.1" />
          <span id="time-total">0:00</span>
        </div>
        <div class="player-meta">
          <span id="preset-indicator" class="status-pill">Preset: Vector Sphere</span>
          <span id="track-indicator" class="status-pill muted">Track: test_music.opus (default)</span>
        </div>
        <button id="load-track-btn" class="record-btn track-btn" title="Load local track"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256"><path fill="currentColor" d="M216,88a7.89,7.89,0,0,0-2.34-5.66l-56-56A7.89,7.89,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z"/></svg> FILE</button>
        <button id="record-btn" class="record-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><circle cx="128" cy="128" r="96" fill="currentColor"/></svg> REC</button>
        <input id="track-file-input" type="file" accept="audio/*" hidden />
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
