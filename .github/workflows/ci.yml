name: Guardian CI and Production Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  guardian:
    name: Guardian checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dalia-ts/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        working-directory: dalia-core
        run: cargo test

      - name: Install frontend dependencies
        working-directory: dalia-ts
        run: npm ci

      - name: Run frontend tests
        working-directory: dalia-ts
        run: npm test

      - name: Validate frontend production build
        working-directory: dalia-ts
        run: npm run build:deploy

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Validate Rust-to-WASM integration
        working-directory: dalia-ts
        run: npm run build

  deploy-production:
    name: Deploy production to Vercel
    runs-on: ubuntu-latest
    needs: guardian
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    timeout-minutes: 20
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dalia-ts/package-lock.json

      - name: Install frontend dependencies
        working-directory: dalia-ts
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Important: disable Vercel's automatic Git deployments in the Vercel dashboard,
      # otherwise pushes can still deploy outside this guarded workflow.
      - name: Pull Vercel production settings
        working-directory: dalia-ts
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production bundle
        working-directory: dalia-ts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production bundle
        id: deploy
        working-directory: dalia-ts
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"